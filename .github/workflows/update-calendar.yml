name: Update calendar

on:
  push:
    branches: [main]
    paths-ignore: ['state/**']
  pull_request:
  schedule:
    - cron: '17 22 * * *' # Following day 06:17 Asia/Shanghai; scheduler may delay.
  workflow_dispatch:
    inputs:
      rollback_run_id:
        description: 'Optional successful run ID with a retained last-good-site artifact'
        required: false
        type: string
      force_deploy:
        description: 'Republish unchanged files to verify a deployment workflow upgrade'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: calendar-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      due: ${{ steps.gate.outputs.due }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/automation.py gate

  build:
    needs: plan
    if: needs.plan.outputs.due == 'true' && !inputs.rollback_run_id
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-test.txt
      - name: Repository preflight
        run: python -B scripts/preflight.py
      - name: Date, independent HKO, ICS and failure tests
        run: python -B -m unittest discover -s tests -v
      - name: Build offline candidate
        run: python -B scripts/calendar_cli.py --output "$env:RUNNER_TEMP/candidate/site" --state-output "$env:RUNNER_TEMP/candidate/events.json"
      - name: Store validated candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate
          include-hidden-files: true
          retention-days: 7

  artifact-check:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate
      - name: Verify downloaded candidate
        run: python -B scripts/verify_artifacts.py --candidate "$env:RUNNER_TEMP/candidate"
      - name: Exercise Pages packaging without deployment
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/candidate/site
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-roundtrip
      - name: Verify Pages archive round trip
        run: python -B scripts/verify_artifacts.py --candidate "$env:RUNNER_TEMP/candidate" --pages-tar "$env:RUNNER_TEMP/pages-roundtrip/artifact.tar"

  publish:
    needs: [plan, build]
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.plan.result == 'success' && needs.plan.outputs.due == 'true' &&
      (needs.build.result == 'success' || inputs.rollback_run_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
      url: https://shiki1255.github.io/personal-calendar/
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Reject superseded source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:EXPECTED_SHA) { throw 'Source changed during build; rerun against current main.' }
      - name: Download validated candidate
        if: inputs.rollback_run_id == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate
      - name: Restore verified publication artifact
        if: inputs.rollback_run_id != ''
        run: python -B scripts/automation.py restore --run-id "$env:ROLLBACK_RUN_ID" --directory "$env:RUNNER_TEMP/candidate"
      - name: Compare live publication
        id: compare
        run: python -B scripts/automation.py changed --site "$env:RUNNER_TEMP/candidate/site"
      - name: Upload complete Pages version
        if: steps.compare.outputs.changed == 'true' || inputs.force_deploy == true
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/candidate/site
      - name: Deploy complete Pages version
        if: steps.compare.outputs.changed == 'true' || inputs.force_deploy == true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify anonymous HTTP, MIME and content hashes
        run: python -B scripts/automation.py verify --site "$env:RUNNER_TEMP/candidate/site"
      - name: Retain last-good publication for rollback
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: last-good-site
          path: ${{ runner.temp }}/candidate
          include-hidden-files: true
          retention-days: 90
      - name: Record actual success and persist event revisions
        run: |
          $arguments = @('-B', 'scripts/automation.py', 'success', '--site', "$env:RUNNER_TEMP/candidate/site", '--candidate-state', "$env:RUNNER_TEMP/candidate/events.json")
          if ($env:ROLLBACK_RUN_ID) { $arguments += '--rollback' }
          python @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Success record failed' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- state/events.json state/health.json state/health
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'chore(calendar): record verified publication and health'
            if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Push failed; no force push is attempted' }
          } elseif ($LASTEXITCODE -ne 0) { throw 'Git diff failed' }
      - name: Close maintenance alert after recovery
        run: python -B scripts/automation.py close-issue

  alert:
    needs: [plan, build, publish]
    if: always() && failure() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reuse one maintenance Issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -B scripts/automation.py failure
